# The conformance and bench binaries of the Rust target.
# They include the generated engine and the runtime from ../src by path and never link the library.
[package]
name = "revera-tools"
version = "0.0.0"
publish = false
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/probe_main.rs"

[[bin]]
name = "bench"
path = "src/bench_main.rs"

[[bin]]
name = "fuzzcase"
path = "src/fuzzcase_main.rs"
