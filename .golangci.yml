# Shared by the go, vego and dev modules; run golangci-lint from inside one of them.
version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # CLI tools write to stdout and stderr without checking; that is fine.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Write
        - (*os.File).WriteString
    staticcheck:
      # QF checks are style rewrites that do not improve the code here.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1006
  exclusions:
    paths:
      - tmp
    rules:
      # vego/probe exercises Vego corners on purpose: dead nil checks,
      # writes to range variables, and similar constructs.
      - path: (^|/)probe/
        linters:
          - ineffassign
          - staticcheck
