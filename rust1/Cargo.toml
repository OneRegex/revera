[package]
name = "revera"
version = "0.1.0"
edition = "2021"

[lib]
name = "revera"
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/probe_main.rs"

[[bin]]
name = "bench"
path = "src/bench_main.rs"

[[bin]]
name = "fuzzcase"
path = "src/fuzzcase_main.rs"

# The Vego specification gives integers Go's wrapping semantics, so
# overflow checks stay off in every profile. The runtime's bounds
# asserts use assert!, which debug-assertions does not control, but
# keeping it on also guards the few debug_assert! sites in std.
[profile.dev]
overflow-checks = false

[profile.release]
overflow-checks = false
debug-assertions = true
